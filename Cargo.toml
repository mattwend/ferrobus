[package]
name = "tiny-mb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
backoff = { version = "0.4", features = ["tokio"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
